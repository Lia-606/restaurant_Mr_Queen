<div class="mesas-module container my-4">
  <h2 class="section-title mb-3">🪑 Gestión de Mesas</h2>

  <!-- FORMULARIO CREAR / EDITAR MESA -->
  <div class="card mb-4 bg-dark text-light p-3 rounded-4 sombra-suave">
    <h5 class="mb-3">➕ Crear Mesa</h5>
    <form id="formAgregarMesa" class="row g-3">
      <!-- Campo oculto para almacenar el ID cuando editamos -->
      <input type="hidden" id="mesaIdEditar" value="">

      <div class="col-md-2">
        <input type="number" id="nuevoNumero" class="form-control campo-oscuro" placeholder="Número de mesa" required min="1" />
      </div>
      <div class="col-md-2">
        <input type="number" id="nuevaCapacidad" class="form-control campo-oscuro" placeholder="Capacidad" required min="1" />
      </div>
      <div class="col-md-3">
        <select id="nuevoEstado" class="form-control campo-oscuro">
          <option value="Libre">Libre</option>
          <option value="Ocupada">Ocupada</option>
          <option value="Reservada">Reservada</option>
          <option value="Pendiente de pago">Pendiente de pago</option>
          <option value="Cerrada">Cerrada</option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="text" id="nuevaUbicacion" class="form-control campo-oscuro" placeholder="Ubicación (opcional)" />
      </div>
      <div class="col-md-2">
        <button id="btnCrearActualizar" type="submit" class="btn btn-crear w-100">Crear</button>
      </div>
    </form>
    <div id="msgCrearMesa" class="msg text-center mt-2"></div>
  </div>

  <!-- MENSAJE GLOBAL -->
  <div id="msgMesas" class="msg text-center mb-3"></div>

  <!-- TABLA DE MESAS -->
  <div class="card bg-dark text-light p-3 rounded-4 sombra-suave">
    <h5 class="mb-3">📋 Mesas</h5>
    <div class="table-responsive mt-3">
      <table class="table table-dark table-hover align-middle tabla-mesas">
        <thead>
          <tr>
            <th>Número</th>
            <th>Capacidad</th>
            <th>Estado</th>
            <th>Ubicación</th>
            <th>Última actualización</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaMesas">
          <tr><td colspan="6" class="text-center">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Enlace al CSS propio del módulo -->
<link rel="stylesheet" href="../public/css/mesas.css" />

<!-- Enlace al JS -->
<script src="../public/js/mesas.js"></script>
