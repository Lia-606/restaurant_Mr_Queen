<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Mr. Queen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg,#ffe6f0,#e8e0ff); }
    .card { border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="max-width:420px; width:100%">
      <h4 class="text-center mb-3">🍽️ Restaurante Mr. Queen</h4>
      <form id="loginForm">
        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input id="correo" type="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="contraseña" class="form-label">Contraseña</label>
          <input id="contraseña" type="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
      </form>
      <hr>
      <button id="btnInvitado" class="btn btn-outline-secondary w-100">Continuar como invitado</button>
      <div id="msg" class="mt-2 text-center text-danger"></div>
    </div>
  </div>

  <script src="public/js/login.js"></script>
</body>
</html>
